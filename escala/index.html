<script>
const $=s=>document.querySelector(s),LS='escala_v1',WD=['D','S','T','Q','Q','S','S'];
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},monOf=d=>addD(d,-((d.getDay()+6)%7));
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,8),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function def(){const sh=(p,a)=>a.map(([n,s],i)=>({id:p+i,name:n,start:s}));
return{ym:fmt(new Date()).slice(0,7),cfg:{work:538,lunch:70},macros:[{id:'m1',name:'Frente de Caixa'}],sectors:[
{id:'s1',name:'Operadores',macro:'m1',shifts:sh('a',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])},
{id:'s2',name:'Fiscais',macro:'m1',shifts:sh('b',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])},
{id:'s3',name:'Portaria',macro:'m1',shifts:sh('c',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])}],emps:[],days:{},hol:defHol(),daily:{}}}
const HAD_LOCAL_STATE=!!localStorage.getItem(LS);
let ACCESS={ready:false,role:'consulta',viewMode:'consulta',userId:'',note:'Perfil aguardando verificação.'};
const isAdmin=()=>ACCESS.ready&&ACCESS.role==='admin'&&ACCESS.viewMode!=='consulta';
const isAdminAccount=()=>ACCESS.ready&&ACCESS.role==='admin';
const profileLabel=()=>isAdmin()?'Administrativo':(isAdminAccount()?'Consulta (visualização)':'Consulta');
function refreshProfileUI(){const adminView=isAdmin(),adminAccount=isAdminAccount(),signedIn=ACCESS.ready&&ACCESS.userId&&ACCESS.userId!=='local';document.body.classList.toggle('readonly',!adminView);const b=$('#profileBadge');if(b)b.textContent='Perfil: '+profileLabel();const t=$('#profileToggle');if(t){t.style.display=signedIn?'':'none';t.textContent=adminAccount?(adminView?'Alternar para Consulta':'Voltar ao Administrativo'):'Como mudar perfil?';t.title=adminAccount?'Alterna somente o modo desta interface. O perfil real continua sendo controlado pelo Supabase.':'O perfil de acesso é definido no Supabase; esta conta não pode conceder privilégios a si mesma.'}}
async function toggleProfileView(){if(!isAdminAccount()){alert('Sua conta está como Consulta no Supabase. O botão não pode elevar o acesso; um administrador deve atribuir role=admin a esta conta na tabela escala_roles.');return}const toConsult=isAdmin();if(toConsult&&SYNC.dirty){await syncNow();if(SYNC.dirty){alert('Há alterações pendentes que não foram confirmadas pelo Supabase. Resolva a sincronização antes de alternar para consulta.');return}}
 ACCESS.viewMode=toConsult?'consulta':'admin';try{if(ACCESS.viewKey)localStorage.setItem(ACCESS.viewKey,ACCESS.viewMode)}catch(e){}refreshProfileUI();render();if(toConsult)setSt('Modo Consulta para visualização: as alterações estão bloqueadas nesta interface. A conta continua autorizada como admin no Supabase.');else{setSt('Modo Administrativo ativo.');await syncNow()}}
function denyWrite(){if(window.SYNC)setSt('Perfil de consulta: alteração bloqueada; nenhum dado foi enviado.',true);return false}
let S;try{S=JSON.parse(localStorage.getItem(LS))||def()}catch(e){S=def()}
S.hol??=defHol();S.daily??={};
const save=()=>{if(!isAdmin())return denyWrite();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){if(window.SYNC)setSt('Erro ao salvar neste aparelho; a alteração não foi encaminhada ao Supabase.',true);return false}if(window.markDirty)markDirty();else if(window.SYNC)setSt('Salvo somente neste aparelho; sem sessão na nuvem.',false);return true};
function ensureHierarchy(){let changed=false;if(!Array.isArray(S.macros)||!S.macros.length){
 const macro={id:'m'+uid(),name:'Frente de Caixa'};S.macros=[macro];
 const oldFront=S.sectors.find(s=>s.name.trim().toLocaleLowerCase('pt-BR')==='frente de caixa');
 if(oldFront&&!S.sectors.some(s=>s!==oldFront&&s.name.trim().toLocaleLowerCase('pt-BR')==='operadores'))oldFront.name='Operadores';
 S.sectors.forEach(s=>s.macro=macro.id);changed=true;
 }else{const fallback=S.macros[0];S.sectors.forEach(s=>{if(!S.macros.some(m=>m.id===s.macro)){s.macro=fallback.id;changed=true}})}if(changed)save()}
ensureHierarchy();
const endOf=st=>toHM(toMin(st)+S.cfg.work+S.cfg.lunch),secOf=id=>S.sectors.find(s=>s.id===id),macroOf=id=>S.macros.find(m=>m.id===id);
const newEmp=(name,sector,shift,startDate=fmt(new Date()))=>({id:uid(),name,sector,startDate,shifts:[{from:startDate,shift}]});
const sortEmps=emps=>[...emps].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
const activeFrom=e=>e.startDate||'0000-00-00';
function shiftOn(e,date){const sec=secOf(e.sector);if(!sec?.shifts?.length)return null;let id=e.shifts?.[0]?.shift||sec.shifts[0].id;for(const c of e.shifts||[])if(c.from<=date)id=c.shift;return sec.shifts.find(x=>x.id===id)||sec.shifts[0]}

/* ---------- GERAÇÃO ---------- */
function balanceShifts(){const[y,m]=S.ym.split('-'),ms=y+'-'+m+'-01',mi=(+y)*12+(+m);
 S.sectors.forEach(sec=>{const es=sortEmps(S.emps.filter(e=>e.sector===sec.id)),N=es.length,L=sec.shifts.length-1;if(N<3||L<1)return;
  const close=Math.round(N*5/7),rest=N-close,ids=[];
  for(let i=0;i<L;i++){const c=Math.floor(rest/L)+(i<rest%L?1:0);for(let j=0;j<c;j++)ids.push(sec.shifts[i].id)}
  for(let j=0;j<close;j++)ids.push(sec.shifts[L].id);
  es.forEach((e,i)=>{const id=ids[(i+mi)%N],from=activeFrom(e)>ms?activeFrom(e):ms;e.shifts=e.shifts.filter(c=>c.from<from);e.shifts.push({from,shift:id})})})}
function gen(){
 if(!isAdmin())return denyWrite();
 if(!S.emps.length)return alert('Cadastre colaboradores primeiro.');
 if(S.cfg.bal!==false)balanceShifts();
 const[y,m]=S.ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0);
 for(let w=monOf(first);w<=last;w=addD(w,7)){
  const wn=Math.floor(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())/864e5/7);
  S.sectors.forEach(sec=>{
   const people=S.emps.filter(e=>e.sector===sec.id);
   const load=[0,0,0,0,0];
   const N=people.length,k=N<2?0:Math.max(1,Math.round(N*0.3)),o0=N?(wn*k)%N:0;
    const rows=people.map((e,i)=>({e,i,sunWork:!(k&&((i-o0)%N+N)%N<k)}));
   const ordered=[...rows].sort((a,b)=>(b.sunWork?2:1)-(a.sunWork?2:1)||a.i-b.i);
   ordered.forEach(r=>{
    const need=r.sunWork?2:1,chosen=[];
    for(let n=0;n<need;n++){
     let best=null;
     for(let d=0;d<5;d++){
      if(chosen.includes(d))continue;
      let score=load[d]*1000;
      if(chosen.length&&Math.abs(d-chosen[0])===1)score+=180;
      if(chosen.length)score-=Math.abs(d-chosen[0])*25;
      score+=((d-r.i-wn+50)%5);
      if(best===null||score<best.score)best={d,score};
     }
     chosen.push(best.d);load[best.d]++;
    }
    const D=S.days[r.e.id]??={};
    for(let d=0;d<7;d++){
     const k=fmt(addD(w,d));
     if(k<activeFrom(r.e))continue;
     D[k]=d===6?(r.sunWork?'T':'F'):(chosen.includes(d)?'F':'T');
    }
   });
  });
 }
 save();render();
}

// Inclui apenas a escala do novo colaborador; nunca modifica as linhas existentes.
function generateNewHire(e){
 const [y,m]=S.ym.split('-').map(Number),first=fmt(new Date(y,m-1,1)),last=fmt(new Date(y,m,0));
 const from=activeFrom(e)>first?activeFrom(e):first,sec=secOf(e.sector);if(!sec||from>last)return;
 const D=S.days[e.id]??={};
 for(let w=monOf(new Date(from+'T12:00:00'));w<=new Date(y,m-1,new Date(y,m,0).getDate());w=addD(w,7)){
  const dates=Array.from({length:7},(_,i)=>fmt(addD(w,i))),sunday=dates[6],canSet=dates.map((k,i)=>({k,i})).filter(x=>x.k>=from&&x.k<=last);
  if(!canSet.length)continue;
  const peers=S.emps.filter(x=>x.id!==e.id&&x.sector===e.sector&&activeFrom(x)<=sunday),sunOff=peers.filter(x=>(S.days[x.id]||{})[sunday]==='F').length;
  const sundayOff=sunday>=from&&sunday<=last&&sunOff<Math.round((peers.length+1)*0.3);
  const weekdays=canSet.filter(x=>x.i<6),target=Math.min(weekdays.length,sundayOff?1:2);
  const offLoad=x=>peers.reduce((n,p)=>n+((S.days[p.id]||{})[x.k]==='F'?1:0),0);
  const chosen=[];
  while(chosen.length<target){
   const options=weekdays.filter(x=>!chosen.some(c=>Math.abs(c.i-x.i)===1));
   const pool=options.length?options:weekdays.filter(x=>!chosen.some(c=>c.k===x.k));
   if(!pool.length)break;
   pool.sort((a,b)=>offLoad(b)-offLoad(a)||a.i-b.i);chosen.push(pool[0]);
  }
  canSet.forEach(x=>{D[x.k]=x.i===6?(sundayOff?'F':'T'):(chosen.some(c=>c.k===x.k)?'F':'T')});
 }
}
function leastUsedShift(sector,date){
 const counts=sector.shifts.map(()=>0);S.emps.filter(e=>e.sector===sector.id&&activeFrom(e)<=date).forEach(e=>{const sh=shiftOn(e,date),i=sector.shifts.findIndex(x=>x.id===sh?.id);if(i>=0)counts[i]++});
 return sector.shifts[counts.indexOf(Math.min(...counts))];
}

function weekCheck(e,y,m){
 const D=S.days[e.id]||{},last=new Date(y,m,0),first=new Date(y,m-1,1),bad=[];
 for(let w=monOf(first);w<=last;w=addD(w,7)){
  const dates=[0,1,2,3,4,5,6].map(d=>addD(w,d));
  if(!dates.every(dt=>dt.getFullYear()===y&&dt.getMonth()===m-1))continue;
  const ds=dates.map(dt=>D[fmt(dt)]);
  if(!ds.every(Boolean))continue;
  const sundayOff=ds[6]==='F',weekOff=ds.slice(0,6).filter(v=>v==='F').length;
  if((sundayOff&&weekOff!==1)||(!sundayOff&&weekOff!==2))bad.push(fmt(w).split('-').reverse().slice(0,2).join('/'));
 }
 return bad.length?`<span class="w check" title="Semana(s) fora da regra 5x2: ${bad.join(', ')}">⚠ 5x2</span>`:`<span class="ok check" title="Semanas completas dentro da regra 5x2">✓ 5x2</span>`;
}

 }
 if(Array.isArray(local)&&Array.isArray(cloud)&&local.every(x=>x&&x.id)&&cloud.every(x=>x&&x.id)&&(!hb||Array.isArray(base))){
  const bm=new Map((base||[]).map(x=>[x.id,x])),lm=new Map(local.map(x=>[x.id,x])),cm=new Map(cloud.map(x=>[x.id,x])),ids=[...new Set([...cloud.map(x=>x.id),...local.map(x=>x.id)])],out=[];
  ids.forEach(id=>{const v=mergeNode(bm.get(id),lm.get(id),cm.get(id),bm.has(id),lm.has(id),cm.has(id));if(v!==undefined)out.push(v)});return out;
 }
 return cloud;
}
function mergeStates(base,local,cloud){return mergeNode(base,local,cloud,!!base,true,true)||cloud}
async function syncNow(){const Y=SYNC;if(!sget()||Y.busy)return;if(!ACCESS.ready)await loadAccess();Y.busy=true;let ok=false;setSt('Consultando o Supabase…');
 try{const rem=await pull();
  if(!isAdmin()){
   if(!rem){Y.dirty=false;setSt('Sem escala publicada no banco. Perfil consulta: nada foi enviado.',true)}
   else{applyRemote(rem);render();Y.dirty=false;ok=true;setSt('Dados carregados do Supabase às '+hhmm()+' — perfil consulta; nenhuma alteração enviada.')}
  }else{
   const cached=lsj(BASE_DATA_K,null);if(!Y.dirty&&cached&&!sameJSON(S,cached)){Y.dirty=true;Y.ver++}
   const base=localStorage.getItem(BASE_K)||'',baseData=lsj(BASE_DATA_K,null);
   if(!rem)await doPush();
   else if(rem.updated_at===base){if(Y.dirty)await doPush();else lss(BASE_DATA_K,rem.data)}
   else if(!Y.dirty&&(base||!HAD_LOCAL_STATE)){applyRemote(rem);render()}
   else{const merged=mergeStates(baseData,S,rem.data);Y.loading=true;S=merged;normalize();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}Y.loading=false;Y.dirty=true;Y.ver++;
    if(!sameJSON(S,rem.data))await doPush();else applyRemote(rem);render()}
   ok=true;setSt('Supabase confirmou a sincronização às '+hhmm()+'.')
  }
 }catch(e){setSt('Não confirmado no Supabase. A cópia deste aparelho foi mantida. Erro: '+e.message,true)}
 finally{Y.busy=false;if(ok&&Y.dirty){clearTimeout(Y.timer);Y.timer=setTimeout(syncNow,800)}}}
async function doLogin(){const c=cfgGet(),email=$('#lE').value.trim(),pw=$('#lP').value,msg=$('#lMsg');if(!email||!pw){msg.textContent='Informe e-mail e senha.';return}
 msg.textContent='Entrando…';
 try{const r=await fetch(c.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})}),j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.msg||'E-mail ou senha inválidos');saveSess(j,email);lss(LOC_K,null);boot()}
 catch(e){msg.textContent=e.message}}
function saveCfg(){const u=$('#cU').value.trim(),k=$('#cK').value.trim();if(!u||!k)return alert('Informe a URL e a chave.');lss(CFG_K,{url:u,key:k});boot()}
function resetCfg(){lss(CFG_K,null);boot()}
function useLocal(){lss(LOC_K,'1');ACCESS={ready:true,role:'consulta',userId:'local',note:'Modo local sem nuvem — somente consulta.'};boot()}
async function sair(){const Y=SYNC;if(Y.dirty&&sget()){await syncNow()}
 const pend=Y.dirty;if(pend&&!confirm('Há alterações que não foram enviadas para a nuvem. Sair mesmo assim?'))return;
 lss(SES_K,null);lss(LOC_K,null);
 if(!pend&&S.emps.length&&confirm('Sair concluído. Apagar também os dados guardados neste navegador? (continuam seguros na nuvem)')){lss(LS,null);lss(BASE_K,null);lss(BASE_DATA_K,null);S=def();normalize()}
 boot()}
function impFile(inp){if(!isAdmin())return denyWrite();const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.sectors)||!Array.isArray(d.emps))throw 0;if(!confirm('Importar este backup e substituir os dados atuais?'))return;
  S=d;normalize();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}markDirty();render()}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f);inp.value=''}
function goTab(t){tab=t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));render()}
function renderLogin(){const c=cfgGet(),need=!c.url||!c.key;
 $('#m').innerHTML=`<div class=card style="max-width:420px;margin:24px auto"><h3>Entrar</h3>`+(need?
 `<p class=hint>Informe o Project URL e a chave publicável do Supabase (Connect ou Settings → API Keys).</p><div class=row><input id=cU placeholder="Project URL (https://xxxx.supabase.co)" style="width:100%"></div><div class=row><input id=cK placeholder="Chave publicável (sb_publishable_...) ou anon" style="width:100%"></div><button class=p onclick="saveCfg()">Salvar configuração</button>`:
 `<div class=row><input id=lE type=email placeholder="E-mail" style="width:100%" autocomplete=username></div><div class=row><input id=lP type=password placeholder="Senha" style="width:100%" autocomplete=current-password onkeydown="if(event.key==='Enter')doLogin()"></div><button class=p onclick="doLogin()">Entrar</button> <span id=lMsg class=bad></span><p class=hint>O login fica salvo neste navegador até você clicar em Sair.</p>`)+
 `<hr style="border:0;border-top:1px solid #e2e8f0;margin:14px 0"><button class=s onclick="useLocal()">Usar só neste navegador (sem nuvem)</button> ${need?'':'<button class=x onclick="resetCfg()">Alterar configuração</button>'}</div>`}
function renderHome(){const s=sget(),cards=[['escala','Escala mensal','Gerar e editar a escala do mês'],['diario','Escala diária','Presença, almoço/janta e PDV'],['colab','Colaboradores','Cadastro e turnos'],['setores','Setores e horários','Macros, sub-setores e jornada'],['feriados','Feriados','Calendário de feriados']],note=isAdminAccount()&&!isAdmin()?'Modo Consulta para visualização; a permissão real da conta continua como admin no Supabase.':ACCESS.note;
 $('#m').innerHTML=`<div class=card><h3>${s?'Olá, '+esc(s.email):'Modo local (sem nuvem)'} <span class="tag">Perfil: ${esc(profileLabel())}</span></h3>
 <div class=row><span class=hint>${esc(note||'')}</span></div>
 <div class=row><span id=hSt class=hint>${esc(SYNC.msg||(s?'':'Os dados ficam só neste navegador.'))}</span></div>
 <div class=row>${s?`<button class=s onclick="syncNow()">Sincronizar agora</button>`:`<button class=s onclick="lss(LOC_K,null);boot()">Entrar na nuvem</button>`}
 <button class=s onclick="exp()">Exportar backup</button><label class="s admin-only" style="cursor:pointer;display:inline-block;padding:7px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff">Importar backup<input type=file accept=".json,application/json" style="display:none" onchange="impFile(this)"></label>
 <button class=x onclick="sair()">Sair</button></div></div>
 <div class=hgrid>${cards.map(c=>`<button class=hcard onclick="goTab('${c[0]}')"><b>${c[1]}</b><span class=hint>${c[2]}</span></button>`).join('')}</div>`}
function boot(){const s=sget(),loc=localStorage.getItem(LOC_K)==='1',on=!!(s||loc);
 document.body.classList.toggle('nolog',!on);const bo=document.querySelector('#btnOut');if(bo)bo.style.display=on?'':'none';
 if(!on){ACCESS={ready:true,role:'consulta',viewMode:'consulta',userId:'',note:'Entre para consultar os dados.'};refreshProfileUI();tab='login';renderLogin();return}
 goTab('home');
 if(s){ACCESS={ready:false,role:'consulta',viewMode:'consulta',userId:'',note:'Carregando perfil…'};refreshProfileUI();setSt('Carregando perfil e consultando o Supabase…');loadAccess().then(()=>{render();syncNow()})}
 else{ACCESS={ready:true,role:'consulta',viewMode:'consulta',userId:'local',note:'Modo local sem nuvem — somente consulta; nada é enviado ao banco.'};refreshProfileUI();setSt('Modo local — somente consulta; alterações não são permitidas.')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sget()&&!SYNC.dirty)syncNow()});
window.addEventListener('online',()=>{if(sget())syncNow()});
window.addEventListener('beforeunload',e=>{if(SYNC.dirty){e.preventDefault();e.returnValue=''}});

let tab='home';window.escalaSetorFilter='todos';window.colabMacroFilter='todos';window.colabAreaFilter='todos';window.colabNameFilter='';window.scaleNameFilter='';window.scaleFocusDay='todos';
function render(){({login:renderLogin,home:renderHome,escala:renderEscala,diario:renderDiario,colab:renderColab,setores:renderSetores,feriados:renderFeriados})[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
boot();
