<script>
const $=s=>document.querySelector(s),LS='escala_v1',WD=['D','S','T','Q','Q','S','S'];
const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},monOf=d=>addD(d,-((d.getDay()+6)%7));
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,8),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function def(){const sh=(p,a)=>a.map(([n,s],i)=>({id:p+i,name:n,start:s}));
return{ym:fmt(new Date()).slice(0,7),cfg:{work:538,lunch:70},macros:[{id:'m1',name:'Frente de Caixa'}],sectors:[
{id:'s1',name:'Operadores',macro:'m1',shifts:sh('a',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])},
{id:'s2',name:'Fiscais',macro:'m1',shifts:sh('b',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])},
{id:'s3',name:'Portaria',macro:'m1',shifts:sh('c',[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']])}],emps:[],days:{},hol:defHol(),daily:{}}}
let S;try{S=JSON.parse(localStorage.getItem(LS))||def()}catch(e){S=def()}
S.hol??=defHol();S.daily??={};
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
function ensureHierarchy(){let changed=false;if(!Array.isArray(S.macros)||!S.macros.length){
 const macro={id:'m'+uid(),name:'Frente de Caixa'};S.macros=[macro];
 const oldFront=S.sectors.find(s=>s.name.trim().toLocaleLowerCase('pt-BR')==='frente de caixa');
 if(oldFront&&!S.sectors.some(s=>s!==oldFront&&s.name.trim().toLocaleLowerCase('pt-BR')==='operadores'))oldFront.name='Operadores';
 S.sectors.forEach(s=>s.macro=macro.id);changed=true;
 }else{const fallback=S.macros[0];S.sectors.forEach(s=>{if(!S.macros.some(m=>m.id===s.macro)){s.macro=fallback.id;changed=true}})}if(changed)save()}
ensureHierarchy();
const endOf=st=>toHM(toMin(st)+S.cfg.work+S.cfg.lunch),secOf=id=>S.sectors.find(s=>s.id===id),macroOf=id=>S.macros.find(m=>m.id===id);
function shiftOn(e,date){const sec=secOf(e.sector);let id=e.shifts[0].shift;for(const c of e.shifts)if(c.from<=date)id=c.shift;return sec.shifts.find(x=>x.id===id)||sec.shifts[0]}
const newEmp=(name,sector,shift)=>({id:uid(),name,sector,shifts:[{from:'0000-00-00',shift}]});
const sortEmps=emps=>[...emps].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));

/* ---------- GERAÇÃO ---------- */
function gen(){
 if(!S.emps.length)return alert('Cadastre colaboradores primeiro.');
 const[y,m]=S.ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0);
 for(let w=monOf(first);w<=last;w=addD(w,7)){
  const wn=Math.floor(Date.UTC(w.getFullYear(),w.getMonth(),w.getDate())/864e5/7);
  S.sectors.forEach(sec=>{
   const people=S.emps.filter(e=>e.sector===sec.id);
   const load=[0,0,0,0,0];
   const rows=people.map((e,i)=>({e,i,sunWork:((i+wn)%2===0)}));
   const ordered=[...rows].sort((a,b)=>(b.sunWork?2:1)-(a.sunWork?2:1)||a.i-b.i);
   ordered.forEach(r=>{
    const need=r.sunWork?2:1,chosen=[];
    for(let n=0;n<need;n++){
     let best=null;
     for(let d=0;d<5;d++){
      if(chosen.includes(d))continue;
      let score=load[d]*1000;
      if(chosen.length&&Math.abs(d-chosen[0])===1)score+=180;
      if(chosen.length)score-=Math.abs(d-chosen[0])*25;
      score+=((d-r.i-wn+50)%5);
      if(best===null||score<best.score)best={d,score};
     }
     chosen.push(best.d);load[best.d]++;
    }
    const D=S.days[r.e.id]??={};
    for(let d=0;d<7;d++){
     const k=fmt(addD(w,d));
     D[k]=d===6?(r.sunWork?'T':'F'):(chosen.includes(d)?'F':'T');
    }
   });
  });
 }
 save();render();
}

/* ---------- ESCALA ---------- */
function weekCheck(e,y,m){
 const D=S.days[e.id]||{},last=new Date(y,m,0),first=new Date(y,m-1,1),bad=[];
 for(let w=monOf(first);w<=last;w=addD(w,7)){
  const dates=[0,1,2,3,4,5,6].map(d=>addD(w,d));
  if(!dates.every(dt=>dt.getFullYear()===y&&dt.getMonth()===m-1))continue;
  const ds=dates.map(dt=>D[fmt(dt)]);
  if(!ds.every(Boolean))continue;
  const sundayOff=ds[6]==='F',weekOff=ds.slice(0,6).filter(v=>v==='F').length;
  if((sundayOff&&weekOff!==1)||(!sundayOff&&weekOff!==2))bad.push(fmt(w).split('-').reverse().slice(0,2).join('/'));
 }
 return bad.length?`<span class="w check" title="Semana(s) fora da regra 5x2: ${bad.join(', ')}">⚠ 5x2</span>`:`<span class="ok check" title="Semanas completas dentro da regra 5x2">✓ 5x2</span>`;
}
function renderEscala(){
 const[y,m]=S.ym.split('-').map(Number),n=new Date(y,m,0).getDate();
 const filter=window.escalaSetorFilter||'todos';
 const visible=S.emps.filter(e=>{if(filter==='todos')return true;if(filter.startsWith('macro:'))return secOf(e.sector)?.macro===filter.slice(6);if(filter.startsWith('area:'))return e.sector===filter.slice(5);return e.sector===filter});
 const total=visible.length;
 let h=`<div class="bar"><input type="month" value="${S.ym}" onchange="S.ym=this.value;save();render()">
 <button class="p" onclick="if(confirm('Reorganizar as folgas deste mês? A distribuição atual será recalculada.'))gen()">Reorganizar folgas</button>
 <button class="s" onclick="exp()">Exportar backup (JSON)</button>
 <label class="hint"><b>Filtro macro/ilha:</b> <select class="filter" onchange="window.escalaSetorFilter=this.value;render()">
 <option value="todos" ${filter==='todos'?'selected':''}>Todas as áreas</option>
 ${S.macros.map(m=>`<option value="macro:${m.id}" ${filter==='macro:'+m.id?'selected':''}>Macro: ${esc(m.name)}</option>`).join('')}
 ${S.sectors.map(s=>`<option value="area:${s.id}" ${filter==='area:'+s.id?'selected':''}>${esc(macroOf(s.macro)?.name||'')} › ${esc(s.name)}</option>`).join('')}
 </select></label>
 <span class="hint">F = folga. Clique numa célula para editar.</span></div>`;
 if(!visible.length){h+=`<div class="card">Nenhum colaborador encontrado para este filtro.</div>`;$('#m').innerHTML=h;return}
 const stats=[];
 for(let d=1;d<=n;d++){
  const k=fmt(new Date(y,m-1,d));let work=0,off=0;
  visible.forEach(e=>{const v=(S.days[e.id]||{})[k];if(v==='F')off++;else work++});
  stats.push({work,off});
 }
 h+=`<div class="summary"><div class="box"><b>Total:</b> ${total}</div><div class="box"><b>Regra:</b> semana segunda–domingo / 5x2</div><div class="box"><b>Folgas:</b> distribuídas entre segunda e sábado</div>${holBox(y,m)}</div>`;
 h+='<div class="scroll"><table><thead><tr><th class="nm">Colaborador</th>';
 for(let d=1;d<=n;d++){const w=new Date(y,m-1,d).getDay(),hh=holOf(fmt(new Date(y,m-1,d)));h+=`<th class="${(w?'':'sun')+(hh?' hol':'')}" ${hh?`title="${esc(hh.n)}"`:''}>${d}<br><small>${WD[w]}${hh?' ★':''}</small></th>`}
 h+='<th class="check">5x2</th></tr>';
 h+='<tr class="cov"><th class="nm">TOTAL</th>';stats.forEach(()=>h+=`<th>${total}</th>`);h+='<th class="check">—</th></tr>';
 h+='<tr class="cov"><th class="nm">TRABALHANDO</th>';stats.forEach(x=>h+=`<th class="stat work">${x.work}<br><small>${total?Math.round(x.work/total*100):0}%</small></th>`);h+='<th class="check">—</th></tr>';
 h+='<tr class="cov"><th class="nm">FOLGA</th>';stats.forEach(x=>h+=`<th class="stat off">${x.off}<br><small>${total?Math.round(x.off/total*100):0}%</small></th>`);h+='<th class="check">—</th></tr></thead><tbody>';
 S.macros.forEach(macro=>{
  const areas=S.sectors.filter(s=>s.macro===macro.id),macroCount=areas.reduce((sum,s)=>sum+visible.filter(e=>e.sector===s.id).length,0);if(!macroCount)return;
  h+=`<tr class="sec"><td colspan="${n+2}">${esc(macro.name)}</td></tr>`;
  areas.forEach(sec=>{
  const emps=sortEmps(visible.filter(e=>e.sector===sec.id));if(!emps.length)return;
  h+=`<tr class="subsec"><td colspan="${n+2}">${esc(sec.name)} — ${emps.length} colaborador(es)</td></tr>`;
  const cnt=Array(n+1).fill(0);
  emps.forEach(e=>{
   h+=`<tr><td class="nm">${esc(e.name)}</td>`;
   for(let d=1;d<=n;d++){
    const k=fmt(new Date(y,m-1,d)),v=(S.days[e.id]||{})[k],sun=(new Date(y,m-1,d).getDay()?'':' sun')+(isHol(k)?' hol':'');
    if(!v)h+=`<td class="c${sun}" onclick="edit('${e.id}','${k}')"></td>`;
    else if(v==='F')h+=`<td class="f${sun}" onclick="edit('${e.id}','${k}')">F</td>`;
    else{const s=shiftOn(e,k);cnt[d]++;h+=`<td class="c t${sec.shifts.indexOf(s)%4}" title="${esc(s.name)} ${s.start}–${endOf(s.start)}" onclick="edit('${e.id}','${k}')">${s.start}</td>`}
   }
   h+=`<td class="check">${weekCheck(e,y,m)}</td></tr>`;
  });
  h+=`<tr class="cov"><td class="nm">Trabalhando</td>${cnt.slice(1).map(c=>`<td>${c}</td>`).join('')}<td class="check">—</td></tr>`;
  });
 });
 $('#m').innerHTML=h+'</tbody></table></div>';
}
let cur;
function edit(eid,k){const e=S.emps.find(x=>x.id===eid),sec=secOf(e.sector);cur={e,k};
 $('#dlgT').textContent=e.name+' — '+k.split('-').reverse().join('/');
 $('#dSt').value=(S.days[e.id]||{})[k]||'T';
 $('#dSh').innerHTML=sec.shifts.map(s=>`<option value="${s.id}">${esc(s.name)} ${s.start}–${endOf(s.start)}</option>`).join('');
 $('#dSh').value=shiftOn(e,k).id;$('#dlg').showModal()}
function applyEdit(){const{e,k}=cur;(S.days[e.id]??={})[k]=$('#dSt').value;const sid=$('#dSh').value;
 if(sid!==shiftOn(e,k).id){e.shifts=e.shifts.filter(c=>c.from<k);e.shifts.push({from:k,shift:sid})}
 save();$('#dlg').close();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='escala-backup.json';a.click()}

/* ---------- COLABORADORES ---------- */
function sample(){const q={s1:8,s2:4,s3:3};S.sectors.forEach(sec=>{for(let i=0;i<q[sec.id];i++)S.emps.push(newEmp(sec.name.split(' ')[0]+' '+(i+1),sec.id,sec.shifts[i%sec.shifts.length].id))});save();render()}
function renderColab(){
 let h=`<div class=card><h3>Novo colaborador</h3><div class=row><input id=nN placeholder="Nome"><select id=nS>${S.sectors.map(s=>`<option value="${s.id}">${esc(macroOf(s.macro)?.name||'')} › ${esc(s.name)}</option>`).join('')}</select>
 <button class=p onclick="addEmp()">Adicionar</button></div><span class=hint>Escolha a ilha/sub-setor. O turno é definido na lista abaixo; mudanças durante o mês são feitas na escala.</span></div>
 <div class=card><h3>Colaboradores (${S.emps.length})</h3>
 <div class="filters"><input id="colabSearch" type="text" placeholder="Pesquisar colaborador" value="${esc(window.colabNameFilter||'')}" onkeydown="if(event.key==='Enter')searchColabs()">
 <button class=p onclick="searchColabs()">Pesquisar colaborador</button>
 <button class=s onclick="clearColabSearch()">Limpar</button>
 <label class=hint>Setor macro: <select class=filter onchange="setColabMacroFilter(this.value)"><option value="todos" ${(window.colabMacroFilter||'todos')==='todos'?'selected':''}>Todos</option>${S.macros.map(m=>`<option value="${m.id}" ${(window.colabMacroFilter||'todos')===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
 <label class=hint>Sub-setor/ilha: <select class=filter onchange="window.colabAreaFilter=this.value;render()"><option value="todos">Todas</option>${S.sectors.filter(s=>(window.colabMacroFilter||'todos')==='todos'||s.macro===window.colabMacroFilter).map(s=>`<option value="${s.id}" ${(window.colabAreaFilter||'todos')===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label></div>`;
 const q=(window.colabNameFilter||'').trim().toLocaleLowerCase('pt-BR'),mf=window.colabMacroFilter||'todos',af=window.colabAreaFilter||'todos';
 const matches=S.emps.filter(e=>{const area=secOf(e.sector);return area&&(mf==='todos'||area.macro===mf)&&(af==='todos'||e.sector===af)&&(!q||e.name.toLocaleLowerCase('pt-BR').includes(q))});
 if(!matches.length)h+=`<p class=hint>Nenhum colaborador encontrado. Ajuste os filtros ou a pesquisa.</p>`;
 S.macros.forEach(macro=>{const macroEmps=matches.filter(e=>secOf(e.sector)?.macro===macro.id);if(!macroEmps.length)return;
  h+=`<h3 style="margin:16px 0 6px">${esc(macro.name)}</h3>`;
  S.sectors.filter(s=>s.macro===macro.id).forEach(sec=>{const emps=sortEmps(macroEmps.filter(e=>e.sector===sec.id));if(!emps.length)return;
  h+=`<h4 style="margin:8px 0 4px">${esc(sec.name)} <span class=hint>(${emps.length})</span></h4>`;
  emps.forEach(e=>{const currentSec=secOf(e.sector);
   h+=`<div class="colab-list"><div class=row><input type=text aria-label="Nome do colaborador" value="${esc(e.name)}" onchange="setE('${e.id}','name',this.value)">
   <select aria-label="Sub-setor ou ilha" onchange="setE('${e.id}','sector',this.value)">${S.sectors.map(s=>`<option value="${s.id}" ${s.id===e.sector?'selected':''}>${esc(macroOf(s.macro)?.name||'')} › ${esc(s.name)}</option>`).join('')}</select>
   <select aria-label="Turno" onchange="setE('${e.id}','shift',this.value)">${currentSec.shifts.map(s=>`<option value="${s.id}" ${s.id===e.shifts[0].shift?'selected':''}>${esc(s.name)} ${s.start}–${endOf(s.start)}</option>`).join('')}</select>
   <button class=x onclick="delE('${e.id}')">Excluir</button></div></div>`});
  });
 });
 $('#m').innerHTML=h+'</div>'}
function searchColabs(){window.colabNameFilter=$('#colabSearch').value.trim();render()}
function setColabMacroFilter(id){window.colabMacroFilter=id;window.colabAreaFilter='todos';render()}
function clearColabSearch(){window.colabNameFilter='';window.colabMacroFilter='todos';window.colabAreaFilter='todos';render()}
function addEmp(){const n=$('#nN').value.trim(),s=$('#nS').value;if(!n)return;S.emps.push(newEmp(n,s,secOf(s).shifts[0].id));save();render()}
function setE(id,f,v){const e=S.emps.find(x=>x.id===id);
 if(f==='name')e.name=v;else if(f==='sector'){e.sector=v;e.shifts=[{from:'0000-00-00',shift:secOf(v).shifts[0].id}]}else e.shifts[0].shift=v;
 save();render()}
function delE(id){if(!confirm('Excluir colaborador?'))return;S.emps=S.emps.filter(e=>e.id!==id);delete S.days[id];save();render()}

/* ---------- SETORES E HORÁRIOS ---------- */
function renderSetores(){
 let h=`<div class=card><h3>Jornada</h3><div class=row><label>Horas trabalhadas <input type=time value="${toHM(S.cfg.work)}" onchange="S.cfg.work=toMin(this.value);save();render()"></label>
 <label>Almoço <input type=time value="${toHM(S.cfg.lunch)}" onchange="S.cfg.lunch=toMin(this.value);save();render()"></label></div>
 <span class=hint>Loja 08:00–21:00, com cobertura até 21:58. A saída é calculada: entrada + trabalhadas + almoço. Em vermelho: passa de 21:58.</span></div>`;
 h+=`<div class=card><h3>Adicionar setor macro</h3><div class=row><input id="newMacro" placeholder="Nome do setor macro" onkeydown="if(event.key==='Enter')addMacro()"><button class=p onclick="addMacro()">Adicionar macro</button></div><span class=hint>Dentro de cada macro, cadastre sub-setores ou ilhas; eles usarão os mesmos filtros, escalas e turnos.</span></div>`;
 S.macros.forEach(macro=>{
  h+=`<div class=card><div class=row><b>Setor macro:</b><input value="${esc(macro.name)}" onchange="macroOf('${macro.id}').name=this.value;save();render()"></div>
  <div class=row><input id="newArea-${macro.id}" placeholder="Nome do sub-setor ou ilha" onkeydown="if(event.key==='Enter')addSector('${macro.id}')"><button class=s onclick="addSector('${macro.id}')">+ Sub-setor/ilha</button></div>`;
  S.sectors.filter(s=>s.macro===macro.id).forEach(sec=>{
   h+=`<div class=colab-list><div class=row><b>Sub-setor/ilha:</b><input value="${esc(sec.name)}" onchange="secOf('${sec.id}').name=this.value;save();render()">
   <label class=hint>Mover para macro: <select onchange="secOf('${sec.id}').macro=this.value;save();render()">${S.macros.map(m=>`<option value="${m.id}" ${m.id===sec.macro?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
   <button class=x onclick="delSector('${sec.id}')">Excluir sub-setor/ilha</button></div>`;
   sec.shifts.forEach(s=>{const en=endOf(s.start);
    h+=`<div class=row><input value="${esc(s.name)}" onchange="shOf('${sec.id}','${s.id}').name=this.value;save()">
    <input type=time value="${s.start}" onchange="shOf('${sec.id}','${s.id}').start=this.value;save();render()">
    <span class="${toMin(en)>toMin('21:58')?'bad':''}">até ${en}</span>
    ${sec.shifts.length>1?`<button class=x onclick="delSh('${sec.id}','${s.id}')">Remover</button>`:''}</div>`});
   h+=`<button class=s onclick="addSh('${sec.id}')">+ Turno</button></div>`
  });
  h+=`</div>`;
 });
 $('#m').innerHTML=h}
const shOf=(sid,id)=>secOf(sid).shifts.find(x=>x.id===id);
function addMacro(){const name=$('#newMacro').value.trim();if(!name)return;if(S.macros.some(m=>m.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))return alert('Já existe um setor macro com esse nome.');S.macros.push({id:'m'+uid(),name});save();render()}
function addSector(macroId){const input=$('#newArea-'+macroId),name=input.value.trim();if(!name)return;
 if(S.sectors.some(s=>s.macro===macroId&&s.name.trim().toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')))return alert('Já existe uma ilha/sub-setor com esse nome neste macro.');
 const p=uid();S.sectors.push({id:'s'+uid(),macro:macroId,name,shifts:[{id:p+'0',name:'Abertura',start:'08:00'},{id:p+'1',name:'Intermediário',start:'10:00'},{id:p+'2',name:'Fechamento',start:'11:50'}]});save();render()}
let delId;
function delSector(id){const sec=secOf(id);if(!sec)return;const emps=S.emps.filter(e=>e.sector===id);delId=id;
 if(!emps.length){if(!confirm(`Excluir o sub-setor "${sec.name}" e seus turnos?`))return;return doDelSector()}
 $('#delT').textContent=`Excluir "${sec.name}"`;$('#delP').textContent=`Há ${emps.length} colaborador(es) neste sub-setor.`;
 $('#delDest').innerHTML=S.sectors.filter(s=>s.id!==id).map(s=>`<option value="${s.id}">Mover para ${esc(macroOf(s.macro)?.name||'')} › ${esc(s.name)}</option>`).join('')+'<option value="__del">Excluir também os colaboradores</option>';
 $('#dlgDel').showModal()}
function confirmDelSector(){const d=$('#delDest').value,emps=S.emps.filter(e=>e.sector===delId);
 if(d==='__del'){if(!confirm(`Excluir ${emps.length} colaborador(es) junto com o sub-setor? Isso não pode ser desfeito.`))return;const ids=emps.map(e=>e.id);S.emps=S.emps.filter(e=>!ids.includes(e.id));ids.forEach(x=>delete S.days[x])}
 else emps.forEach(e=>{e.sector=d;e.shifts=[{from:'0000-00-00',shift:secOf(d).shifts[0].id}]});
 $('#dlgDel').close();doDelSector()}
function doDelSector(){const id=delId;S.sectors=S.sectors.filter(s=>s.id!==id);
 if(window.escalaSetorFilter==='area:'+id)window.escalaSetorFilter='todos';if(window.colabAreaFilter===id)window.colabAreaFilter='todos';if(window.dSec===id)window.dSec='todos';save();render()}
function addSh(sid){secOf(sid).shifts.push({id:uid(),name:'Novo turno',start:'09:00'});save();render()}
function delSh(sid,id){const sec=secOf(sid);sec.shifts=sec.shifts.filter(s=>s.id!==id);save();render()}


/* ---------- FERIADOS ---------- */
function defHol(){const l=[['2026-01-01','Confraternização Universal'],['2026-04-03','Sexta-feira Santa'],['2026-04-21','Tiradentes'],['2026-05-01','Dia do Trabalho'],['2026-06-04','Corpus Christi'],['2026-09-07','Independência do Brasil'],['2026-10-12','Nossa Senhora Aparecida'],['2026-11-02','Finados'],['2026-11-15','Proclamação da República'],['2026-11-20','Consciência Negra'],['2026-12-25','Natal'],
['2027-01-01','Confraternização Universal'],['2027-03-26','Sexta-feira Santa'],['2027-04-21','Tiradentes'],['2027-05-01','Dia do Trabalho'],['2027-05-27','Corpus Christi'],['2027-09-07','Independência do Brasil'],['2027-10-12','Nossa Senhora Aparecida'],['2027-11-02','Finados'],['2027-11-15','Proclamação da República'],['2027-11-20','Consciência Negra'],['2027-12-25','Natal']];
 return l.map(([d,n])=>({id:uid(),d,n}))}
const holOf=k=>S.hol.find(h=>h.d===k),isHol=k=>!!holOf(k);
function holBox(y,m){const p=y+'-'+pad(m),l=S.hol.filter(h=>h.d.startsWith(p)).sort((a,b)=>a.d.localeCompare(b.d));
 return l.length?`<div class="box hol"><b>Feriados:</b> ${l.map(h=>h.d.slice(8)+' '+esc(h.n)).join(' · ')}</div>`:''}
function renderFeriados(){const hs=[...S.hol].sort((a,b)=>a.d.localeCompare(b.d));
 let h=`<div class=card><h3>Novo feriado</h3><div class=row><input type=date id=hD><input id=hN placeholder="Nome do feriado" style="min-width:220px"><button class=p onclick="addHol()">Adicionar</button></div>
 <span class=hint>Feriados ficam destacados (★) na escala mensal e na diária. Inclua também os municipais.</span></div><div class=card><h3>Feriados (${hs.length})</h3>`;
 hs.forEach(x=>{h+=`<div class=row><input type=date value="${x.d}" onchange="editHol('${x.id}','d',this.value)"><input value="${esc(x.n)}" style="min-width:220px" onchange="editHol('${x.id}','n',this.value)"><button class=x onclick="delHol('${x.id}')">Excluir</button></div>`});
 $('#m').innerHTML=h+'</div>'}
function addHol(){const d=$('#hD').value,n=$('#hN').value.trim();if(!d||!n)return alert('Informe data e nome.');S.hol.push({id:uid(),d,n});save();render()}
function editHol(id,f,v){const x=S.hol.find(h=>h.id===id);if(v)x[f]=v;save();render()}
function delHol(id){S.hol=S.hol.filter(h=>h.id!==id);save();render()}

/* ---------- ESCALA DIÁRIA ---------- */
window.dDay=fmt(new Date());window.dSec='todos';
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const dg=(id,k)=>(S.daily[k]||{})[id]||{};
function setD(id,f,v){const k=window.dDay,o=((S.daily[k]??={})[id]??={});o[f]=v;if(f==='st'&&v!=='P'){o.brk='';o.pdv=''}save();renderDiario()}
function goDay(v){if(v){window.dDay=v;renderDiario()}}
function moveDay(n){window.dDay=fmt(addD(new Date(window.dDay+'T12:00'),n));renderDiario()}
function renderDiario(){
 const k=window.dDay,dt=new Date(k+'T12:00'),hh=holOf(k);let nP=0,nF=0,nA=0,nL=0,nJ=0,body='',any=false;
 S.sectors.filter(s=>window.dSec==='todos'||s.id===window.dSec).forEach(sec=>{
  const es=S.emps.filter(e=>e.sector===sec.id);if(!es.length)return;
  es.forEach(e=>{if((S.days[e.id]||{})[k])any=true});
  const work=es.filter(e=>(S.days[e.id]||{})[k]==='T'),off=es.filter(e=>(S.days[e.id]||{})[k]!=='T');
  body+=`<h3 style="margin:16px 0 0">${esc(macroOf(sec.macro)?.name||'')} › ${esc(sec.name)}</h3>`;
  sec.shifts.forEach(s=>{const ps=work.filter(e=>shiftOn(e,k).id===s.id);
   body+=`<div class=dsh><span>${esc(s.name)} · ${s.start}–${endOf(s.start)}</span><span>${ps.length}</span></div>`;
   if(!ps.length)body+=`<div class=drow><span class=hint>Ninguém neste turno</span></div>`;
   ps.forEach(e=>{const o=dg(e.id,k),st=o.st||'P',br=o.brk||'';
    if(st==='F')nF++;else if(st==='A')nA++;else{nP++;if(br==='L')nL++;if(br==='J')nJ++}
    body+=`<div class="drow ${st!=='P'?st:br?'brk':''}"><span class=n>${esc(e.name)}</span>
    <select onchange="setD('${e.id}','st',this.value)"><option value=P ${st==='P'?'selected':''}>Presente</option><option value=F ${st==='F'?'selected':''}>Faltou</option><option value=A ${st==='A'?'selected':''}>Atestado</option></select>
    ${st==='P'?`<select onchange="setD('${e.id}','brk',this.value)"><option value="">—</option><option value=L ${br==='L'?'selected':''}>Almoço</option><option value=J ${br==='J'?'selected':''}>Janta</option></select>
    <input class=pdv placeholder="PDV" value="${esc(o.pdv||'')}" onchange="setD('${e.id}','pdv',this.value)">
    ${br?`<span class=tag>${br==='L'?'em almoço':'em janta'}</span>`:''}`:`<span class="tag r">${st==='F'?'faltou':'atestado'}</span>`}</div>`});
  });
  if(off.length)body+=`<div class=hint style="margin-top:6px">Folga: ${off.map(e=>esc(e.name)).join(', ')}</div>`});
 const dsel=`<select onchange="window.dSec=this.value;renderDiario()"><option value=todos>Todos os setores</option>${S.sectors.map(s=>`<option value="${s.id}" ${window.dSec===s.id?'selected':''}>${esc(macroOf(s.macro)?.name||'')} › ${esc(s.name)}</option>`).join('')}</select>`;
 let h=`<div class=bar><button class=s onclick="moveDay(-1)">◀</button><input type=date value="${k}" onchange="goDay(this.value)"><button class=s onclick="moveDay(1)">▶</button>
 <button class=s onclick="goDay(fmt(new Date()))">Hoje</button>${dsel}<b>${DN[dt.getDay()]}</b>${hh?`<span class=hbadge>★ ${esc(hh.n)}</span>`:''}</div>
 <div class=summary><div class=box><b>Presentes:</b> ${nP}</div><div class=box><b>Faltas:</b> ${nF}</div><div class=box><b>Atestados:</b> ${nA}</div><div class=box><b>Em almoço:</b> ${nL}</div><div class=box><b>Em janta:</b> ${nJ}</div></div>`;
 if(!any)h+=`<div class=card>A escala mensal deste dia ainda não foi gerada. Vá em Escala mensal e clique em Reorganizar folgas.</div>`;
 $('#m').innerHTML=h+body}

let tab='escala';window.escalaSetorFilter='todos';window.colabMacroFilter='todos';window.colabAreaFilter='todos';window.colabNameFilter='';
function render(){({escala:renderEscala,diario:renderDiario,colab:renderColab,setores:renderSetores,feriados:renderFeriados})[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
render();
</script></body></html>
