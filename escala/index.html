<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escala Mensal · Paulistão</title>
<style>
:root{--blue:#2f2388;--red:#e3101a;--bg:#f3f4fa;--line:#dfe3ee}
*{box-sizing:border-box}
body{margin:0;font:14px system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:#1f2433}
header{background:#fff;border-bottom:5px solid var(--red);padding:8px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
header img{height:112px;width:112px}
header h1{margin:0;font-size:22px;color:var(--blue)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:none;padding:9px 14px;border-radius:6px;font:inherit;font-weight:600;color:var(--blue);cursor:pointer}
nav button.on{background:var(--blue);color:#fff}
#sv{margin-left:auto;font-size:12px;color:#667}
main{padding:14px}
.bar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
input,select,textarea{padding:6px;border:1px solid #c9cfdf;border-radius:6px;font:inherit;background:#fff}
button.p{background:var(--red);color:#fff;border:0;padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
button.s{background:#fff;border:1px solid #c9cfdf;padding:7px 12px;border-radius:6px;font:inherit;cursor:pointer}
button.x{background:none;border:0;color:#b4121b;cursor:pointer;font:inherit}
.hint{color:#667;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 6px;color:var(--blue)}
.scroll{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse}
th,td{border:1px solid #e6e9f2;padding:3px 4px;text-align:center;font-size:12px;min-width:46px}
th{background:#eef0fa;position:sticky;top:0;z-index:2}
.nm{position:sticky;left:0;background:#fff;text-align:left;min-width:150px;white-space:nowrap;z-index:1}
th.nm{background:#eef0fa;z-index:3}
tr.sec td{background:var(--blue);color:#fff;text-align:left;font-weight:600}
tr.sum td{background:#f7f8fc;color:#556;font-size:11px}
.sun{background:#e4e6f8}.hol{background:#ffd966!important;font-weight:700}
td.c{cursor:pointer}td.t0{background:#dde1fa}td.t1{background:#fde2e4}td.t2{background:#e3efd3}td.t3{background:#d3eaf7}
td.f{background:#d9dce6;color:#555;font-weight:700;cursor:pointer}
.ok{color:#15803d;font-weight:700;white-space:nowrap}.warn{color:#c20f18;font-weight:700;white-space:nowrap;cursor:help}
.group{margin:14px 0 4px;font-weight:700;color:var(--blue)}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px solid #eef0f6}
dialog{border:0;border-radius:10px;padding:18px;box-shadow:0 10px 40px #0005}
dialog label{display:block;margin:10px 0 3px}
@media print{
 @page{size:A4 landscape;margin:8mm}
 header,.noprint{display:none!important}main{padding:0}
 th,td{font-size:9px;min-width:0;padding:1px 2px}.scroll{border:0;overflow:visible}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(max-width:640px){header img{height:64px;width:64px}header h1{font-size:17px}main{padding:8px}}
</style>
</head>

 <h1>Escala de Colaboradores</h1>
 <nav>
  <button data-t="escala" class="on">Escala</button>
  <button data-t="colab">Colaboradores</button>
  <button data-t="horarios">Horários</button>
 </nav>
 <span id="sv"></span>

 <b id="dT"></b>
 <label>Situação
  <select id="dS"><option value="T">Trabalha</option><option value="F">Folga</option></select>
 </label>
 <label>Turno <select id="dH"></select></label>
 <label><input type="checkbox" id="dA"> Aplicar este turno deste dia em diante</label>

<script>
/* ============ utilidades ============ */
const KEY='escala_simples_v1', OLD_KEY='escala_v1', WD=['D','S','T','Q','Q','S','S'];
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const toHM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byName=l=>[...l].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
const br=k=>k.split('-').reverse().join('/');

/* ============ dados ============ */
const HOL=[['2026-11-02','Finados'],['2026-11-15','Proclamação da República'],['2026-11-20','Consciência Negra'],['2026-12-25','Natal'],['2027-01-01','Confraternização Universal']];
function novo(){
 const sh=p=>[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']].map(([name,start],i)=>({id:p+i,name,start}));
 return{ym:'2026-11',work:538,lunch:70,   // 8:58 trabalhados + 1:10 de almoço
  sectors:[{id:'s1',name:'Operadores',shifts:sh('a')},{id:'s2',name:'Fiscais',shifts:sh('b')},{id:'s3',name:'Portaria',shifts:sh('c')}],
  emps:[],days:{},holidays:HOL.map(([d,n])=>({d,n}))};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.sectors)S=novo();
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(S));$('#sv').textContent='Salvo neste navegador às '+pad(new Date().getHours())+':'+pad(new Date().getMinutes())}
 catch(e){$('#sv').textContent='Não foi possível salvar neste navegador — use Backup'}
}
const secOf=id=>S.sectors.find(s=>s.id===id);
const shOf=(sec,id)=>sec?.shifts.find(x=>x.id===id);
const endOf=st=>toHM(toMin(st)+S.work+S.lunch);
const holOf=k=>S.holidays.find(h=>h.d===k);
const refDate=()=>{const t=fmt(new Date());return t.startsWith(S.ym+'-')?t:S.ym+'-01'};   // "hoje" se o mês exibido for o atual; senão dia 1

/* ============ regra 5x2 ============
 Semana = segunda a domingo. Trabalhou no domingo -> 2 folgas na semana (seg-sáb, não precisam ser seguidas).
 Folgou no domingo -> o domingo + 1 folga na semana. Colaborador admitido no meio da semana: no máximo 5 dias de trabalho nela. */
function planWeek(e,ws,from,load,sunOff){
 const D=S.days[e.id]??={},st=e.start||'';
 const keys=[0,1,2,3,4,5,6].map(i=>fmt(addDays(ws,i)));
 const sched=keys.map(k=>!st||k>=st);                       // dias já admitido
 const nSched=sched.filter(Boolean).length;if(!nSched)return;
 const lock=keys.map((k,i)=>sched[i]&&k<from&&D[k]!==undefined);   // dias já executados: não mexe
 const free=keys.map((k,i)=>sched[i]&&!lock[i]);
 let need=nSched===7?2:Math.max(0,nSched-5);                // folgas da semana
 const prior=[];
 keys.forEach((k,i)=>{if(lock[i]&&D[k]==='F'){need--;if(i<5){prior.push(i);load[i]++}}});
 const sunOffNow=lock[6]?D[keys[6]]==='F':(free[6]&&sunOff&&need>=1);
 if(free[6]&&sunOffNow)need--;                              // domingo de folga já conta como uma
 need=Math.max(0,need);
 const cand=[0,1,2,3,4].filter(i=>free[i]);
 if(cand.length<need&&free[5])cand.push(5);
 const chosen=[];
 while(chosen.length<need&&chosen.length<cand.length){
  const anchor=chosen.length?chosen:prior;let best=null;
  for(const d of cand){
   if(chosen.includes(d))continue;
   let score=(load[d]||0)*1000;                              // dia com menos gente de folga
   if(anchor.some(a=>Math.abs(a-d)===1))score+=180;          // evita folgas coladas
   if(anchor.length)score-=Math.min(...anchor.map(a=>Math.abs(a-d)))*25;
   score+=(d+e.id.charCodeAt(0))%5;                          // desempate estável
   if(best===null||score<best.score)best={d,score};
  }
  chosen.push(best.d);if(best.d<5)load[best.d]++;
 }
 keys.forEach((k,i)=>{
  if(!sched[i]){delete D[k];return}
  if(lock[i])return;
  D[k]=i===6?(sunOffNow?'F':e.shift):(chosen.includes(i)?'F':e.shift);
 });
}
// Gera (ou refaz) o mês para todos, de `from` em diante. Dias anteriores ficam como estão.
function gen(from){
 const[y,m]=S.ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0),fk=fmt(first);
 from=from&&from>fk?from:fk;
 for(let w=mondayOf(first);w<=last;w=addDays(w,7)){
  if(fmt(addDays(w,6))<from)continue;
  const wn=Math.floor(w.getTime()/6048e5);
  S.sectors.forEach(sec=>{
   const ppl=byName(S.emps.filter(e=>e.sector===sec.id)),sunday=fmt(addDays(w,6));
   const active=ppl.filter(e=>!e.start||e.start<=sunday),quota=Math.round(active.length*0.3),sunOff=new Set();   // ~30% de folga no domingo, em rodízio
   for(let j=0;j<quota;j++)sunOff.add(active[(wn*quota+j)%active.length].id);
   const load=[0,0,0,0,0];
   [...ppl].sort((a,b)=>(sunOff.has(a.id)?1:0)-(sunOff.has(b.id)?1:0)).forEach(e=>planWeek(e,w,from,load,sunOff.has(e.id)));
  });
 }
 save();render();
}
// Escala só o colaborador novo, da admissão em diante, sem mexer em ninguém.
function genEmp(e){
 const[y,m]=S.ym.split('-').map(Number),fk=fmt(new Date(y,m-1,1)),lk=fmt(new Date(y,m,0)),st=e.start&&e.start>fk?e.start:fk;
 for(let w=mondayOf(new Date(st+'T12:00'));fmt(w)<=lk;w=addDays(w,7)){
  const sunday=fmt(addDays(w,6)),peers=S.emps.filter(p=>p.id!==e.id&&p.sector===e.sector&&(!p.start||p.start<=sunday));
  const load=[0,1,2,3,4].map(i=>peers.filter(p=>(S.days[p.id]||{})[fmt(addDays(w,i))]==='F').length);
  const sunOffN=peers.filter(p=>(S.days[p.id]||{})[sunday]==='F').length;
  planWeek(e,w,'0000-00-00',load,sunOffN<Math.round((peers.length+1)*0.3));
 }
}
function semanasForaDaRegra(e,y,m){
 const D=S.days[e.id]||{},last=new Date(y,m,0),bad=[];
 for(let w=mondayOf(new Date(y,m-1,1));w<=last;w=addDays(w,7)){
  const v=[0,1,2,3,4,5,6].map(i=>D[fmt(addDays(w,i))]);
  if(v.some(x=>x===undefined))continue;                     // semana incompleta (admissão/virada de mês): não avalia
  const offWk=v.slice(0,6).filter(x=>x==='F').length;
  if(v[6]==='F'?offWk!==1:offWk!==2)bad.push(br(fmt(w)).slice(0,5));
 }
 return bad;
}
const hasMonthData=()=>S.emps.some(e=>Object.keys(S.days[e.id]||{}).some(k=>k.startsWith(S.ym+'-')));

/* ============ tela: escala ============ */
function renderEscala(){
 const[y,m]=S.ym.split('-').map(Number),n=new Date(y,m,0).getDate(),flt=window.fSec||'todos';
 let h=`<div class="bar noprint"><input type="month" value="${S.ym}" onchange="S.ym=this.value||S.ym;save();render()">
 <label class="hint">Setor <select onchange="window.fSec=this.value;render()"><option value="todos">Todos</option>${S.sectors.map(s=>`<option value="${s.id}" ${flt===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>
 <label class="hint">Gerar a partir de <input type="date" id="gFrom" value="${refDate()}"></label>
 <button class="p" onclick="genClick()">Gerar escala</button>
 <button class="s" onclick="exportCSV()">Excel (CSV)</button>
 <button class="s" onclick="window.print()">Imprimir / PDF</button></div>
 <p class="hint noprint">Clique numa célula para editar. F = folga · ★ = feriado · ⚠ = semana fora da regra 5x2 · célula vazia = ainda não admitido ou escala não gerada.</p>`;
 if(!S.emps.length)return $('#m').innerHTML=h+`<div class="card">Nenhum colaborador ainda. Cadastre na aba <b>Colaboradores</b>.</div>`;
 h+=`<div class="scroll"><table><thead><tr><th class="nm">Colaborador</th>`;
 for(let d=1;d<=n;d++){const dt=new Date(y,m-1,d),ho=holOf(fmt(dt));h+=`<th class="${dt.getDay()?'':'sun'} ${ho?'hol':''}" ${ho?`title="${esc(ho.n)}"`:''}>${d}<br><small>${WD[dt.getDay()]}${ho?'★':''}</small></th>`}
 h+=`<th>5x2</th></tr></thead><tbody>`;
 S.sectors.filter(s=>flt==='todos'||s.id===flt).forEach(sec=>{
  const es=byName(S.emps.filter(e=>e.sector===sec.id));if(!es.length)return;
  h+=`<tr class="sec"><td colspan="${n+2}">${esc(sec.name)} — ${es.length} colaborador(es)</td></tr>`;
  const work=Array(n+1).fill(0),off=Array(n+1).fill(0);
  es.forEach(e=>{
   h+=`<tr><td class="nm">${esc(e.name)}</td>`;
   for(let d=1;d<=n;d++){
    const dt=new Date(y,m-1,d),k=fmt(dt),v=(S.days[e.id]||{})[k],cls=(dt.getDay()?'':' sun')+(holOf(k)?' hol':'');
    if(v===undefined)h+=`<td class="c${cls}" onclick="editCell('${e.id}','${k}')"></td>`;
    else if(v==='F'){off[d]++;h+=`<td class="f${cls}" onclick="editCell('${e.id}','${k}')">F</td>`}
    else{const s=shOf(sec,v);work[d]++;h+=`<td class="c t${Math.max(0,sec.shifts.indexOf(s))%4}${cls}" title="${s?esc(s.name)+' '+s.start+'–'+endOf(s.start):'turno removido'}" onclick="editCell('${e.id}','${k}')">${s?s.start:'?'}</td>`}
   }
   const bad=semanasForaDaRegra(e,y,m);
   h+=bad.length?`<td class="warn" title="Semana(s) iniciada(s) em ${bad.join(', ')} fora da regra 5x2">⚠ 5x2</td>`:`<td class="ok">✓ 5x2</td>`;
   h+=`</tr>`;
  });
  const T=es.length,pct=x=>Math.round(x/T*100);
  h+=`<tr class="sum"><td class="nm">Trabalhando</td>${work.slice(1).map(x=>`<td>${x}</td>`).join('')}<td></td></tr>`;
  h+=`<tr class="sum"><td class="nm">Folga (% do setor)</td>${off.slice(1).map(x=>`<td>${x}<br>${pct(x)}%</td>`).join('')}<td></td></tr>`;
 });
 $('#m').innerHTML=h+`</tbody></table></div>`;
}
function genClick(){
 if(!S.emps.length)return alert('Cadastre os colaboradores primeiro.');
 const v=$('#gFrom').value||S.ym+'-01';
 if(!hasMonthData()||confirm(`Gerar a escala de ${br(v)} em diante?\n\nOs dias anteriores a essa data NÃO são alterados.`))gen(v);
}
let cur=null;
function editCell(eid,k){
 const e=S.emps.find(x=>x.id===eid),sec=secOf(e.sector);cur={e,k};
 const v=(S.days[e.id]||{})[k];
 $('#dT').textContent=e.name+' — '+br(k);
 $('#dS').value=v==='F'?'F':'T';
 $('#dH').innerHTML=sec.shifts.map(s=>`<option value="${s.id}">${esc(s.name)} ${s.start}–${endOf(s.start)}</option>`).join('');
 $('#dH').value=v&&v!=='F'&&shOf(sec,v)?v:e.shift;
 $('#dA').checked=false;$('#dlg').showModal();
}
function saveCell(){
 const{e,k}=cur,D=S.days[e.id]??={},st=$('#dS').value,sh=$('#dH').value;
 if(st==='F')D[k]='F';
 else{
  D[k]=sh;
  if($('#dA').checked){e.shift=sh;Object.keys(D).forEach(d=>{if(d>k&&D[d]!=='F')D[d]=sh})}
 }
 save();$('#dlg').close();render();
}
function exportCSV(){
 const[y,m]=S.ym.split('-').map(Number),n=new Date(y,m,0).getDate(),flt=window.fSec||'todos',rows=[];
 rows.push(['Setor','Colaborador',...Array.from({length:n},(_,i)=>{const dt=new Date(y,m-1,i+1);return (i+1)+' '+WD[dt.getDay()]+(holOf(fmt(dt))?'*':'')}),'5x2']);
 S.sectors.filter(s=>flt==='todos'||s.id===flt).forEach(sec=>byName(S.emps.filter(e=>e.sector===sec.id)).forEach(e=>{
  const r=[sec.name,e.name];
  for(let d=1;d<=n;d++){const v=(S.days[e.id]||{})[fmt(new Date(y,m-1,d))];r.push(v===undefined?'':v==='F'?'F':(shOf(sec,v)?.start||'?'))}
  r.push(semanasForaDaRegra(e,y,m).length?'REVISAR':'OK');rows.push(r);
 }));
 const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
 download('escala_'+S.ym+'.csv',csv,'text/csv;charset=utf-8');
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}

/* ============ tela: colaboradores ============ */
function shiftOpts(sid,sel){return secOf(sid).shifts.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)} ${s.start}–${endOf(s.start)}</option>`).join('')}
function renderColab(){
 const f=window.cSec||'todos';
 let h=`<div class="card"><h3>Novo colaborador</h3>
 <div class="row"><input id="nN" placeholder="Nome" onkeydown="if(event.key==='Enter')addEmp()">
 <select id="nS" onchange="$('#nH').innerHTML=shiftOpts(this.value)">${S.sectors.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>
 <select id="nH">${S.sectors.length?shiftOpts(S.sectors[0].id):''}</select>
 <label class="hint">Admissão (opcional) <input type="date" id="nD"></label>
 <button class="p" onclick="addEmp()">Adicionar</button></div>
 <span class="hint">Se o mês já foi gerado, só o novo colaborador é escalado, da admissão em diante — a equipe não muda. Sem data de admissão ele entra desde o dia 1.</span></div>
 <div class="card"><div class="row"><h3 style="margin:0">Colaboradores (${S.emps.length})</h3>
 <select onchange="window.cSec=this.value;render()"><option value="todos">Todos os setores</option>${S.sectors.map(s=>`<option value="${s.id}" ${f===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
 <span class="hint">Ao trocar turno ou setor, vale de ${br(refDate())} em diante.</span>`;
 S.sectors.filter(s=>f==='todos'||s.id===f).forEach(sec=>{
  const es=byName(S.emps.filter(e=>e.sector===sec.id));if(!es.length)return;
  const cnt=sec.shifts.map(s=>`${esc(s.name)} ${es.filter(e=>e.shift===s.id).length}`).join(' · ');
  h+=`<div class="group">${esc(sec.name)} <span class="hint">(${es.length}) · ${cnt}</span> <button class="s" onclick="suggestShifts('${sec.id}')" title="Distribui 20% abertura/intermediário e 50% fechamento (30% folga)">Sugerir turnos 20/50</button></div>`;
  es.forEach(e=>{h+=`<div class="line"><input value="${esc(e.name)}" onchange="setEmp('${e.id}','name',this.value)">
   <select onchange="setEmp('${e.id}','sector',this.value)">${S.sectors.map(s=>`<option value="${s.id}" ${s.id===e.sector?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
   <select onchange="setEmp('${e.id}','shift',this.value)">${shiftOpts(e.sector,e.shift)}</select>
   <span class="hint">Adm.: ${e.start?br(e.start):'—'}</span><button class="x" onclick="delEmp('${e.id}')">Excluir</button></div>`});
 });
 $('#m').innerHTML=h+`</div>`;
}
function addEmp(){
 const name=$('#nN').value.trim(),sector=$('#nS').value,shift=$('#nH').value,start=$('#nD').value;
 if(!name)return alert('Informe o nome.');
 if(!sector||!shift)return alert('Cadastre um setor e um turno na aba Horários.');
 const e={id:uid(),name,sector,shift,start};S.emps.push(e);
 if(hasMonthData())genEmp(e);
 save();render();
}
function setShift(e,v){e.shift=v;const D=S.days[e.id]||{},ref=refDate();Object.keys(D).forEach(k=>{if(k>=ref&&D[k]!=='F')D[k]=v})}
function setEmp(id,f,v){
 const e=S.emps.find(x=>x.id===id);
 if(f==='name')e.name=v.trim()||e.name;
 else if(f==='sector'){e.sector=v;setShift(e,secOf(v).shifts[0].id)}
 else setShift(e,v);
 save();render();
}
function delEmp(id){if(!confirm('Excluir colaborador e a escala dele?'))return;S.emps=S.emps.filter(e=>e.id!==id);delete S.days[id];save();render()}
function suggestShifts(sid){   // 30% folga · 20% abertura/intermediário · 50% fechamento (último horário do setor = fechamento)
 const sec=secOf(sid),es=byName(S.emps.filter(e=>e.sector===sid)),N=es.length,sh=[...sec.shifts].sort((a,b)=>toMin(a.start)-toMin(b.start));
 if(!N||sh.length<2)return alert('É preciso ter colaboradores e pelo menos 2 turnos no setor.');
 if(!confirm(`Redistribuir os turnos de ${sec.name} a partir de ${br(refDate())}?\n\nFechamento ≈ 50% e abertura/intermediário ≈ 20% do dia (com 30% de folga). Você pode ajustar depois, um a um.`))return;
 const F=sh[sh.length-1],O=sh.slice(0,-1),close=Math.round(N*5/7),seats=[];
 for(let i=0;i<N-close;i++)seats.push(O[i%O.length].id);
 for(let i=0;i<close;i++)seats.push(F.id);
 const off=((+S.ym.slice(0,4))*12+(+S.ym.slice(5,7)))%N;       // gira a cada mês
 es.forEach((e,i)=>setShift(e,seats[(i+off)%N]));
 save();render();
}

/* ============ tela: horários ============ */
function renderHorarios(){
 let h=`<div class="card"><h3>Jornada</h3><div class="row">
 <label>Horas trabalhadas <input type="time" value="${toHM(S.work)}" onchange="S.work=toMin(this.value);save();render()"></label>
 <label>Almoço <input type="time" value="${toHM(S.lunch)}" onchange="S.lunch=toMin(this.value);save();render()"></label></div>
 <span class="hint">Loja 08:00–21:00, com pessoas até 21:58. A saída é calculada: entrada + trabalhadas + almoço (em vermelho se passar de 21:58).</span></div>
 <div class="card"><h3>Setores e horários de entrada</h3><div class="row"><input id="nSec" placeholder="Novo setor" onkeydown="if(event.key==='Enter')addSec()"><button class="p" onclick="addSec()">Adicionar setor</button></div></div>`;
 S.sectors.forEach(sec=>{
  h+=`<div class="card"><div class="row"><b>Setor:</b><input value="${esc(sec.name)}" onchange="secOf('${sec.id}').name=this.value.trim()||secOf('${sec.id}').name;save();render()"><button class="x" onclick="delSec('${sec.id}')">Excluir setor</button></div>`;
  sec.shifts.forEach(s=>{const en=endOf(s.start);
   h+=`<div class="row"><input value="${esc(s.name)}" onchange="shOf(secOf('${sec.id}'),'${s.id}').name=this.value;save()">
   <input type="time" value="${s.start}" onchange="shOf(secOf('${sec.id}'),'${s.id}').start=this.value;save();render()">
   <span class="${toMin(en)>toMin('21:58')?'warn':'hint'}">até ${en}</span>
   <button class="x" onclick="delShift('${sec.id}','${s.id}')">Remover</button></div>`});
  h+=`<button class="s" onclick="addShift('${sec.id}')">+ Turno</button></div>`;
 });
 h+=`<div class="card"><h3>Feriados</h3><textarea rows="6" style="width:100%;max-width:520px" onchange="setHol(this.value)">${S.holidays.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>x.d+' '+x.n).join('\n')}</textarea>
 <div class="hint">Um por linha: AAAA-MM-DD Nome. Aparecem destacados (★) na escala.</div></div>
 <div class="card"><h3>Backup</h3><div class="row">
 <button class="s" onclick="download('escala-backup.json',JSON.stringify(S,null,1),'application/json')">Exportar backup</button>
 <label class="s" style="cursor:pointer;padding:7px 12px;border:1px solid #c9cfdf;border-radius:6px;background:#fff">Importar backup<input type="file" accept=".json,application/json" style="display:none" onchange="importFile(this)"></label></div>
 <span class="hint">Os dados ficam só neste navegador. Use o backup para levar a escala para outro computador. Também importa o backup das versões anteriores.</span></div>`;
 $('#m').innerHTML=h;
}
function addSec(){const n=$('#nSec').value.trim();if(!n)return;const p=uid();S.sectors.push({id:'s'+p,name:n,shifts:[['Abertura','08:00'],['Intermediário','10:00'],['Fechamento','11:50']].map(([name,start],i)=>({id:p+i,name,start}))});save();render()}
function delSec(id){if(S.emps.some(e=>e.sector===id))return alert('Há colaboradores neste setor. Mova-os para outro setor antes de excluir.');if(!confirm('Excluir este setor?'))return;S.sectors=S.sectors.filter(s=>s.id!==id);save();render()}
function addShift(sid){secOf(sid).shifts.push({id:uid(),name:'Novo turno',start:'09:00'});save();render()}
function delShift(sid,id){
 const sec=secOf(sid);
 if(sec.shifts.length<2)return alert('O setor precisa de pelo menos um turno.');
 const n=S.emps.filter(e=>e.sector===sid&&e.shift===id).length;
 if(n)return alert(`${n} colaborador(es) usam este turno. Troque o turno deles na aba Colaboradores antes de remover.`);
 sec.shifts=sec.shifts.filter(s=>s.id!==id);
 S.emps.filter(e=>e.sector===sid).forEach(e=>{const D=S.days[e.id]||{};Object.keys(D).forEach(k=>{if(D[k]===id)D[k]=e.shift})});
 save();render();
}
function setHol(t){S.holidays=t.split('\n').map(l=>l.trim().match(/^(\d{4}-\d{2}-\d{2})\s+(.+)$/)).filter(Boolean).map(m=>({d:m[1],n:m[2]}));save();render()}

/* ============ importar backups (inclui o formato das versões anteriores) ============ */
function converterAntigo(o){
 const R=novo(),ym=o.ym||R.ym,ref=ym+'-01';
 R.ym=ym;R.work=o.cfg?.work??R.work;R.lunch=o.cfg?.lunch??R.lunch;
 R.sectors=o.sectors.map(s=>({id:s.id,name:s.name,shifts:(s.shifts||[]).map(x=>({id:x.id,name:x.name,start:x.start}))}));
 if(Array.isArray(o.hol))R.holidays=o.hol.map(h=>({d:h.d,n:h.n}));
 const turnoEm=(e,date)=>{const ch=(e.shifts||[]).filter(c=>c.from<=date).sort((a,b)=>String(a.from).localeCompare(String(b.from)));
  const sec=o.sectors.find(s=>s.id===e.sector);return ch.length?ch[ch.length-1].shift:sec?.shifts?.[0]?.id};
 R.emps=o.emps.map(e=>({id:e.id,name:e.name,sector:e.sector,start:e.startDate&&e.startDate!=='0000-00-00'?e.startDate:'',shift:turnoEm(e,ref)}));
 o.emps.forEach(e=>{const D=o.days?.[e.id]||{};R.days[e.id]={};Object.keys(D).forEach(k=>{R.days[e.id][k]=D[k]==='F'?'F':turnoEm(e,k)})});
 return R;
}
function carregar(o){
 if(!o||!Array.isArray(o.sectors)||!Array.isArray(o.emps))throw new Error('formato');
 S=Array.isArray(o.emps)&&o.emps.length&&Array.isArray(o.emps[0].shifts)?converterAntigo(o):o;
 S.holidays??=HOL.map(([d,n])=>({d,n}));S.days??={};save();render();
}
function importFile(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{if(!confirm('Importar este backup e substituir os dados atuais deste navegador?'))return;carregar(JSON.parse(r.result));alert('Backup importado.')}catch(e){alert('Arquivo de backup inválido.')}};
 r.readAsText(f);inp.value='';
}

/* ============ início ============ */
let tab='escala';
function render(){({escala:renderEscala,colab:renderColab,horarios:renderHorarios})[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});
// primeira vez: aproveita os dados da versão anterior, se estiverem neste navegador
try{
 if(!localStorage.getItem(KEY)){
  const old=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
  if(old&&old.emps?.length&&confirm(`Encontrei os dados da versão anterior neste navegador (${old.emps.length} colaboradores). Importar para esta versão?`))carregar(old);
 }
}catch(e){}
render();
</script>
